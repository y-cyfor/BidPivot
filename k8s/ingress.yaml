apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bidpivot-ingress
  namespace: bidpivot
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
spec:
  ingressClassName: nginx
  rules:
    - host: bidpivot.your-domain.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: bidpivot-backend
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: bidpivot-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bidpivot-frontend
                port:
                  number: 80
  tls:
    - hosts:
        - bidpivot.your-domain.com
      secretName: bidpivot-tls

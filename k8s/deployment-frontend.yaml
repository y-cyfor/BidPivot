apiVersion: apps/v1
kind: Deployment
metadata:
  name: bidpivot-frontend
  namespace: bidpivot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bidpivot-frontend
  template:
    metadata:
      labels:
        app: bidpivot-frontend
    spec:
      containers:
        - name: frontend
          image: bidpivot-frontend:latest
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: bidpivot-frontend
  namespace: bidpivot
spec:
  selector:
    app: bidpivot-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP

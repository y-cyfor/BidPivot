apiVersion: apps/v1
kind: Deployment
metadata:
  name: bidpivot-celery
  namespace: bidpivot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bidpivot-celery
  template:
    metadata:
      labels:
        app: bidpivot-celery
    spec:
      containers:
        - name: celery
          image: bidpivot-backend:latest
          command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
          envFrom:
            - secretRef:
                name: bidpivot-secrets
          livenessProbe:
            exec:
              command: ["python", "-c", "import app.celery_app"]
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["python", "-c", "import app.celery_app"]
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

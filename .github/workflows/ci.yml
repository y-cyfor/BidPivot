name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile
        run: python -m compileall -q backend/app
      - name: Test
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: vben-admin/pnpm-lock.yaml
      - name: Install
        working-directory: vben-admin
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        working-directory: vben-admin
        run: pnpm --filter @bidpivot/frontend typecheck
      - name: Unit tests
        working-directory: vben-admin
        run: pnpm --filter @bidpivot/frontend test
      - name: Build
        working-directory: vben-admin
        run: pnpm --filter @bidpivot/frontend build
